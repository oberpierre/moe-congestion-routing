[project]
name = "moe-congestion-routing"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=1.23.0",
    "lm_eval",
    "numpy>=2.5.1",
    "psutil>=7.2.2",
    "pyarrow>=25.0.0",
    "pybind11>=3.0.4",
    "pyyaml>=6.0.3",
    "scipy>=1.11",
    "simpy>=4.1.2",
    "tensorboard>=2.20.0",
    "torch>=2.13.0",
    "transformers>=5.14.1",
    "wandb>=0.19.0",
]

[project.scripts]
moe-congestion-routing = "moe_congestion_routing.main:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
# The upstream lm-evaluation-harness's own `megatron_lm` optional-dependency group is
# commented out in its pyproject.toml ("requires separate installation of Megatron-LM") because
# it expects a pip-installed Megatron. We drive the vendored Megatron-LM/ submodule via
# MEGATRON_PATH instead, so the plain path dependency is enough. Pinned to a release tag rather
# than a branch so the harness version behind any published number is resolvable.
lm_eval = { path = "lm-evaluation-harness", editable = true }

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]
# Offline figure and notebook work only. Kept out of the default install because a training node
# never needs it, so `uv sync` on the cluster stays unchanged. Install with
# `uv sync --inexact --group analysis`, because a plain `uv sync` prunes the Transformer Engine
# stack that lives outside the lock. `ipykernel` is what an editor needs to run the notebook
# against this `.venv`, and `nbconvert` re-executes it headlessly.
analysis = [
    "ipykernel>=6.29",
    "matplotlib>=3.9",
    "nbconvert>=7.16",
]

[tool.pytest.ini_options]
testpaths = ["src"]

[tool.uv.build-backend]
source-exclude = ["**/*_test.py"]
wheel-exclude = ["**/*_test.py"]
